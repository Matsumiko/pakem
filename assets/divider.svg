<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0bd"/>
      <stop offset="0.45" stop-color="#e8c872" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc2e0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9ccb" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9ec" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd9ec" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="sparkle" d="M0 -4 L0.9 -0.9 L4 0 L0.9 0.9 L0 4 L-0.9 0.9 L-4 0 L-0.9 -0.9Z"/>

    <!-- separuh kanan: dipakai ulang dan dicerminkan untuk sisi kiri -->
    <g id="half">
      <path d="M46 -1.3 L480 -0.2 L480 0.2 L46 1.3Z" fill="url(#gold)"/>
      <rect x="74" y="6" width="270" height="0.8" fill="url(#pink)"/>
      <path d="M56 -3.5 L59.5 0 L56 3.5 L52.5 0Z" fill="#f6e3a4"/>
      <g fill="#f6e3a4">
        <g transform="translate(210 -9)"><use href="#sparkle"><animateTransform attributeName="transform" type="scale" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></use></g>
        <g transform="translate(372 10)"><use href="#sparkle"><animateTransform attributeName="transform" type="scale" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></use></g>
      </g>
    </g>
  </defs>

  <g transform="translate(600 22)">
    <!-- garis: tumbuh dari tengah sekali, lalu tetap -->
    <g>
      <animateTransform attributeName="transform" type="scale" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1" from="0 1" to="1 1" begin="0.2s" dur="1.6s" fill="freeze"/>
      <use href="#half"/>
      <use href="#half" transform="scale(-1 1)"/>
    </g>

    <!-- cahaya yang meluncur ke tengah -->
    <g filter="url(#glow)" fill="#fffbe8">
      <circle r="2.2" cy="0" opacity="0">
        <animate attributeName="cx" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.6 1" values="470;56" dur="6s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" keyTimes="0;0.2;0.8;1" values="0;1;1;0" dur="6s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.2" cy="0" opacity="0">
        <animate attributeName="cx" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.6 1" values="-470;-56" dur="6s" begin="4.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" keyTimes="0;0.2;0.8;1" values="0;1;1;0" dur="6s" begin="4.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ornamen tengah: bunga sakura dalam belah ketupat -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1s" fill="freeze"/>
      <circle r="22" fill="url(#aura)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -14 L14 0 L0 14 L-14 0Z" fill="none" stroke="#f3dd9a" stroke-width="1.2">
        <animateTransform attributeName="transform" type="rotate" values="0;90;90;180;180;270;270;360" keyTimes="0;0.15;0.25;0.4;0.5;0.65;0.75;1" dur="20s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -10.5 L10.5 0 L0 10.5 L-10.5 0Z" fill="none" stroke="#f3dd9a" stroke-opacity="0.35" stroke-width="0.7"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <g fill="#ffc9e3" stroke="#ff9cc9" stroke-width="0.35">
          <ellipse cx="0" cy="-4.3" rx="2.7" ry="4.1"/>
          <ellipse cx="0" cy="-4.3" rx="2.7" ry="4.1" transform="rotate(72)"/>
          <ellipse cx="0" cy="-4.3" rx="2.7" ry="4.1" transform="rotate(144)"/>
          <ellipse cx="0" cy="-4.3" rx="2.7" ry="4.1" transform="rotate(216)"/>
          <ellipse cx="0" cy="-4.3" rx="2.7" ry="4.1" transform="rotate(288)"/>
        </g>
      </g>
      <circle r="1.9" fill="#f6c453">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-26" r="1.8" fill="#ffc2e0"><animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="26" r="1.8" fill="#ffc2e0"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/></circle>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>